# Quality Scale for KKT Kolbe Integration
# See: https://developers.home-assistant.io/docs/core/integration-quality-scale/

rules:
  # Bronze tier (Internal)
  action-setup:
    status: done
    comment: 12 services registered in services.py with services.yaml documentation
  appropriate-polling:
    status: done
    comment: Uses configurable polling interval (default 30s) with local push updates
  brands:
    status: done
    comment: Brand information properly configured in manifest
  common-modules:
    status: done
    comment: Uses common Home Assistant modules and helpers
  config-flow-test-coverage:
    status: done
    comment: Tests in tests/test_config_flow.py
  config-flow:
    status: done
    comment: Full config flow with discovery, manual setup, and API modes
  dependency-transparency:
    status: done
    comment: All deps in manifest.json (tinytuya, pycryptodome, aiohttp, tuya-device-sharing-sdk)
  docs-actions:
    status: done
    comment: All 12 services documented in services.yaml with full field descriptions
  docs-high-level-description:
    status: done
    comment: README provides comprehensive overview
  docs-installation-instructions:
    status: done
    comment: HACS and manual installation documented
  docs-removal-instructions:
    status: done
    comment: Standard Home Assistant removal process
  entity-event-setup:
    status: exempt
    comment: Uses coordinator pattern, not event subscriptions
  entity-unique-id:
    status: done
    comment: All entities have unique IDs based on device_id and entity type
  has-entity-name:
    status: done
    comment: All entities use has_entity_name = True pattern
  runtime-data:
    status: done
    comment: Uses entry.runtime_data with KKTKolbeRuntimeData dataclass (HA 2024.6+)
  test-before-configure:
    status: done
    comment: Connection test available during setup
  test-before-setup:
    status: done
    comment: Device connection validated before entity setup
  unique-config-entry:
    status: done
    comment: Uses device_id as unique identifier

  # Silver tier
  action-exceptions:
    status: done
    comment: Services use ServiceValidationError and translated exceptions
  config-entry-unloading:
    status: done
    comment: Proper unload implemented in __init__.py
  docs-configuration-parameters:
    status: done
    comment: All config options documented
  docs-troubleshooting:
    status: done
    comment: Troubleshooting section in README
  dynamic-devices:
    status: done
    comment: mDNS/UDP discovery + rescan_devices service for runtime device detection
  entity-category:
    status: done
    comment: Diagnostic entities properly categorized
  entity-disabled-by-default:
    status: done
    comment: Advanced entities disabled by default
  entity-translations:
    status: done
    comment: Full translations in en.json and de.json
  exception-translations:
    status: done
    comment: Error messages translated
  icon-translations:
    status: done
    comment: Entity translations with icons in translations/*.json
  log-when-unavailable:
    status: done
    comment: Logs connection issues with appropriate levels
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 set in all entity platforms (coordinator-driven)
  reauthentication-flow:
    status: done
    comment: Reauth flow implemented for expired credentials
  reconfiguration-flow:
    status: done
    comment: Options flow allows reconfiguration

  # Gold tier
  devices:
    status: done
    comment: Proper device registry integration
  diagnostics:
    status: done
    comment: Full diagnostics in diagnostics.py
  discovery-update-info:
    status: done
    comment: Device info updated on discovery
  discovery:
    status: done
    comment: Zeroconf and API-based discovery supported
  docs-data-update:
    status: done
    comment: Update mechanism documented
  docs-examples:
    status: done
    comment: Usage examples in README
  docs-known-limitations:
    status: done
    comment: Limitations documented
  docs-supported-devices:
    status: done
    comment: Supported devices listed
  docs-supported-functions:
    status: done
    comment: Features documented per device type
  docs-use-cases:
    status: done
    comment: Use cases described
  entity-device-class:
    status: done
    comment: Appropriate device classes used
  integration-owner:
    status: done
    comment: "@moag1000 listed as codeowner"
  repair-issues:
    status: done
    comment: Repair flows in repairs.py for common issues
  stale-devices:
    status: done
    comment: StaleDeviceTracker in device_tracker.py with 30-day auto-cleanup
  test-coverage:
    status: done
    comment: 15 test files covering all platforms, services, coordinator, discovery

  # Platinum tier
  async-dependency:
    status: todo
    comment: >-
      tinytuya is a synchronous library; all device I/O is wrapped in
      hass.async_add_executor_job. A native-async Tuya dependency would be
      required to satisfy this rule.
  inject-websession:
    status: todo
    comment: >-
      Coordinator and cloud API use async_get_clientsession. icon_downloader
      and some config-flow steps still create ad-hoc aiohttp.ClientSessions —
      route these through the shared session to complete this rule.
  strict-typing:
    status: todo
    comment: >-
      Type hints and `from __future__ import annotations` are used throughout,
      but there is no enforced strict mypy gate / py.typed marker verifying it.
